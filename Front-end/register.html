<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AIR Pollution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-dark">Tạo tài khoản mới</h3>
                        <p class="text-muted">Tham gia theo dõi biến đổi không khí cùng chúng tôi</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regName" class="form-label fw-semibold">Họ và Tên</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="regName"
                                    placeholder="Nguyễn Văn A" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regDob" class="form-label fw-semibold">Ngày sinh</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i
                                        class="bi bi-calendar-date text-muted"></i></span>
                                <input type="date" class="form-control border-start-0 ps-0" id="regDob" required>
                            </div>
                        </div>


                        <div class="mb-3">
                            <label for="regEmail" class="form-label fw-semibold">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="regEmail"
                                    placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="regPassword" class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="regPassword"
                                    placeholder="Tạo mật khẩu (ít nhất 6 ký tự)" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="regConfirm" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i
                                        class="bi bi-shield-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="regConfirm"
                                    placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>

                        <div id="registerError" class="text-danger small mb-3 text-center" style="display: none;"></div>

                        <button type="submit" class="btn btn-info text-white w-100 py-2 mb-3 fw-bold rounded-3">
                            <i class="bi bi-person-plus-fill me-2"></i> Đăng ký tài khoản
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Đã có tài khoản? <a href="login.html"
                                class="text-decoration-none fw-bold text-primary">Đăng nhập</a></p>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
