<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AIR Pollution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <div class="bg-info bg-opacity-10 text-info rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                            style="width: 60px; height: 60px;">
                            <i class="bi bi-cloud-haze2-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Chào mừng trở lại!</h3>
                        <p class="text-muted">Hệ thống phân tích và dự báo AQI khu vực Quận 1</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email"
                                    placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password"
                                    placeholder="••••••••" required>
                            </div>
                        </div>

                        <div id="loginError" class="text-danger small mb-3 text-center" style="display: none;"></div>

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3 fw-bold rounded-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Chưa có tài khoản? <a href="register.html"
                                class="text-decoration-none fw-bold text-info">Đăng ký ngay</a></p>
                        <a href="index.html" class="text-decoration-none text-muted small mt-2 d-block"><i
                                class="bi bi-arrow-left me-1"></i> Quay lại trang chủ</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
